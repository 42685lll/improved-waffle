name: Build StarHoshino APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find assets dir
        id: assets
        run: |
          DIR=$(find . -type d -name assets | head -n 1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found assets dir: $DIR"

      - name: Verify ai_core.js
        run: |
          DIR="${{ steps.assets.outputs.dir }}"
          if [ -z "$DIR" ]; then
            echo "assets directory not found"
            exit 1
          fi
          ls -R "$DIR"
          test -f "$DIR/ai_core.js" || { echo "ai_core.js missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarHoshino-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports
            app/build/outputs/logs
            **/build/reports
            **/*.log
          if-no-files-found: ignore
